name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Bash syntax
        run: bash -n hysteria.sh tests/test.sh
      - name: Repository static checks
        shell: pwsh
        run: ./tests/static-check.ps1
      - name: ShellCheck
        run: shellcheck --severity=warning hysteria.sh tests/test.sh
      - name: Unit tests
        run: bash tests/test.sh
